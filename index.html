<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070605">
  <title>Ordem Paranormal-MVP (OP-MVP)</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="book-frame" aria-hidden="true">
    <span class="book-corner book-corner-tl"></span>
    <span class="book-corner book-corner-tr"></span>
    <span class="book-corner book-corner-bl"></span>
    <span class="book-corner book-corner-br"></span>
  </div>
  <div class="app">
    <header class="topbar">
      <div class="wrap topbar-inner">
        <button type="button" class="brand" data-action="go-home">
          <img class="brand-seal" src="assets/logo.png" alt="">
          <span class="brand-text">
            <span class="brand-kicker">Ordem Paranormal-MVP</span>
            <h1>OP-MVP</h1>
          </span>
        </button>
        <p class="brand-sub">Pontuação do MVP</p>
      </div>
    </header>
    <main id="app" class="wrap">
      <noscript><p>Ative o JavaScript para usar o OP-MVP.</p></noscript>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
